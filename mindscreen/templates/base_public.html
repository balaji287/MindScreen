<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}MindScreen{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="pub-nav"><div class="container"><a class="logo" href="{{ url_for('main.landing') }}"><i></i>MindScreen</a>
<a class="l" href="{{ url_for('main.landing') }}#how">How it works</a><a class="l" href="{{ url_for('quick.index') }}">Quick analyser</a><a class="l" href="{{ url_for('main.model_card') }}">Model card</a><a class="l" href="{{ url_for('main.about') }}">About</a>
{% if user %}<a class="btn sm" href="{{ url_for('main.home') }}">Open Dashboard</a>{% else %}<a class="l" href="{{ url_for('auth.login') }}">Log in</a><a class="btn sm" href="{{ url_for('auth.register') }}">Get started</a>{% endif %}</div></header>
{% block body %}{% endblock %}
<footer class="pub"><div class="container">MindScreen is a research prototype and screening aid, not a medical device or diagnosis. Built on a public survey dataset; not clinically validated.</div></footer>
<script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
