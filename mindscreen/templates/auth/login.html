{% extends "base_public.html" %}{% from "_macros.html" import csrf, flashes %}{% block title %}Log in · MindScreen{% endblock %}{% block body %}
<div class="container"><div class="card auth"><h1>Log in</h1>{{ flashes() }}{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('auth.login', next=next) if next else url_for('auth.login') }}">{{ csrf() }}
<label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" name="password" required autocomplete="current-password">
<p><button class="btn">Log in</button></p></form><p class="small mute">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p></div></div>{% endblock %}
